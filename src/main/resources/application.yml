server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/binance}
    username: ${DB_USERNAME:binance}
    password: ${DB_PASSWORD:binance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}
  connect-timeout: ${BINANCE_CONNECT_TIMEOUT:PT3S}
  read-timeout: ${BINANCE_READ_TIMEOUT:PT5S}
logging:
  level:
    com.example.binance: INFO
