services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-binance}
      POSTGRES_USER: ${POSTGRES_USER:-binance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binance}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-binance}
      DB_USERNAME: ${POSTGRES_USER:-binance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-binance}
      BINANCE_SYMBOL: ${BINANCE_SYMBOL:-BNBUSDT}
      BINANCE_POLL_INTERVAL: ${BINANCE_POLL_INTERVAL:-PT30S}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
